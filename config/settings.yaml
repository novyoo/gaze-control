camera:
  index: 0
  width: 640       # changed from 1280
  height: 480      # changed from 720
  fps: 30

gaze:
  smoothing_window: 5
  confidence_threshold: 0.7

cursor:
  screen_padding: 50
  movement_speed: 1.0
  smooth_factor: 0.12
  deadzone_radius: 8
  
gestures: 
  click_threshold: 0.04
  scroll_sensitivity: 3.0

voice:
  language: "en-US"
  energy_threshold: 300        # mic sensitivity — raise if background noise
  pause_threshold: 0.8         # seconds of silence to end a phrase
  dynamic_energy: true         # auto-adjusts to background noise
  enabled: true

screen:
  auto_detect: true    # reads actual resolution at runtime
  width: 1920          # fallback if auto_detect fails
  height: 1080

mapping:
  # Gaze values outside this range are clamped (tuned for ~60cm camera distance)
  gaze_x_min: 0.35
  gaze_x_max: 0.65
  gaze_y_min: 0.38
  gaze_y_max: 0.62
  # Padding so cursor doesn't need to look to extreme edges
  screen_padding_x: 80   # pixels
  screen_padding_y: 60

smoothing:
  process_noise: 0.03       # lower = smoother but slower to respond
  measurement_noise: 0.5    # higher = more smoothing, less raw noise
  initial_uncertainty: 1.0

calibration:
  points: 9                  # number of calibration points
  samples_per_point: 30      # gaze samples collected per dot
  hold_seconds: 1.5          # how long to stare at each dot
  dot_radius: 20             # size of calibration dot
  save_path: "config/calibration.json"