camera:
  index: 0
  width: 640       # changed from 1280
  height: 480      # changed from 720
  fps: 30

gaze:
  smoothing_window: 5
  confidence_threshold: 0.7

cursor:
  screen_padding: 50
  movement_speed: 1.0
  deadzone_radius: 10

gestures: 
  click_threshold: 0.04
  scroll_sensitivity: 3.0

voice:
  language: "en-US"
  energy_threshold: 300

screen:
  auto_detect: true    # reads actual resolution at runtime
  width: 1920          # fallback if auto_detect fails
  height: 1080

mapping:
  gaze_x_min: 0.42      # was 0.35 — raise this if cursor won't reach left edge
  gaze_x_max: 0.58      # was 0.65 — lower this if cursor won't reach right edge
  gaze_y_min: 0.42      # was 0.38
  gaze_y_max: 0.58      # was 0.62
  screen_padding_x: 40  # was 80 — less padding = more screen coverage
  screen_padding_y: 30  # was 60

cursor:
  smooth_factor: 0.08   # was 0.12 — lower = less jitter, smoother feel
  deadzone_radius: 12   # was 8 — bigger deadzone = less fidgeting when still